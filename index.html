<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเอกสารบัญชี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap">
<style id="mainstyle">
/* VOICE: calm office tool, the company's paperwork made quick — clear, exact, no decoration.
   IDEA: an in-tray of Thai office forms; status shows as rubber stamps on each paper.
   PICTURE: the working tray itself — pending papers, budgets, advances — then the form as a sheet of paper.
   COLOUR and TYPE: white paper + ink, pen-blue for action, stamp-red for reject/overdue; IBM Plex Sans Thai UI, Sarabun for paper.
   LAYOUT: ink top band with nav; content 1240px; forms one calm column of sections, totals beside the item table. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121418);--panel:light-dark(#f4f5f7,#1a1d23);--ink:light-dark(#15171b,#eceef2);--mut:light-dark(#5d636e,#9aa1ad);
--line:light-dark(#e2e4e9,#2c3039);--blue:light-dark(#2347c5,#8ea8ff);--blueb:light-dark(#e8edfc,#1f2742);--red:light-dark(#c62f2a,#ff7a70);--redb:light-dark(#fdecea,#3a1f1f);
--top:light-dark(#15171b,#0b0c0f);--amber:light-dark(#9a5b00,#f3b555);--amberb:light-dark(#fff4e0,#3a2c14)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}html{scroll-padding-top:72px}
header{background:var(--top);color:#fff;padding:0 max(4vw,16px)}
header .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-height:64px}
.brand{font-weight:700;font-size:18px;line-height:1.2}.brand small{display:block;font-weight:400;font-size:13px;color:#b9bec8}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{color:#d7dae0;text-decoration:none;padding:10px 14px;border-radius:8px;font-size:15px;min-height:44px;display:flex;align-items:center}
nav a:hover{background:#ffffff14}nav a.on{background:#fff;color:#15171b;font-weight:600}
.banner{background:var(--amberb);color:var(--amber);padding:10px max(4vw,16px);font-size:14px}
h1{font-size:clamp(28px,3.4vw,40px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
h2{font-size:22px;margin:0 0 12px;line-height:1.25}h3{font-size:17px;margin:0 0 10px}
.mut{color:var(--mut)}.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--mut)}.btn.pri{background:var(--blue);border-color:var(--blue);color:light-dark(#fff,#0d1020)}.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.redf{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px;margin:18px 0 26px}
.stat{background:var(--panel);border-radius:14px;padding:16px 18px}
.stat b{display:block;font-size:clamp(26px,3vw,34px);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:14px;color:var(--mut)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
/* tray */
.tray{display:grid;gap:10px}
.paper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-decoration:none;color:inherit;box-shadow:0 1px 0 var(--line),0 3px 0 -1px var(--bg),0 4px 0 -1px var(--line);transition:transform .15s}
.paper:hover{transform:translateY(-2px);border-color:var(--mut)}
.paper .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paper .m{font-size:13px;color:var(--mut);grid-column:1}
.paper .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;padding:0 8px;font-size:13px;font-weight:700;line-height:22px;white-space:nowrap;transform:rotate(-2deg)}
.s-draft{color:var(--mut)}.s-pending{color:var(--blue)}.s-approved{color:light-dark(#fff,#0d1020);background:var(--blue);border-color:var(--blue)}.s-rejected{color:var(--red)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mut)}
/* types */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px}
.type{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;text-align:left;min-height:140px;position:relative;overflow:hidden}
.type:hover{border-color:var(--blue)}
.type .code{font-size:13px;color:var(--mut)}.type b{font-size:17px;line-height:1.3}.type span{font-size:14px;color:var(--mut)}
.type::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;border:3px solid var(--blueb)}
/* bars */
.bar{height:10px;border-radius:5px;background:var(--panel);overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .c{background:color-mix(in srgb,var(--blue) 45%,transparent)}.bar .s{background:var(--blue)}.bar .o{background:var(--red)}
.proj{padding:14px 0;border-bottom:1px solid var(--line)}.proj:last-child{border:0}
.proj .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* table */
table{border-collapse:collapse;width:100%}
.list th{text-align:left;font-size:13px;color:var(--mut);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.list tr[data-href]{cursor:pointer}.list tr[data-href]:hover td{background:var(--panel)}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.filters>*{flex:1 1 180px}
input,select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{min-height:80px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--panel);color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);border-color:transparent}
/* form */
.dochead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.dochead .stamp{font-size:15px;line-height:28px;padding:0 12px}
.sheet{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
@media(max-width:1000px){.sheet{grid-template-columns:minmax(0,1fr)}}
.sec{border:1px solid var(--line);border-radius:14px;padding:18px clamp(14px,2vw,22px);margin-bottom:16px;background:var(--bg)}
.sec>h3{display:flex;gap:10px;align-items:baseline}.sec>h3 em{font-style:normal;color:var(--blue);font-variant-numeric:tabular-nums}
.flds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
@media(max-width:640px){.flds{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:5px}.fld.full{grid-column:1/-1}
.fld>span{font-size:14px;font-weight:500}.fld>span i{color:var(--red);font-style:normal;margin-left:2px}
.fld small{color:var(--mut);font-size:13px}
.fld output{min-height:44px;display:flex;align-items:center;padding:0 12px;background:var(--blueb);border-radius:10px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:15px}
.seg input:checked+span{background:var(--blue);border-color:var(--blue);color:light-dark(#fff,#0d1020)}
.seg input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.seg input:disabled+span{cursor:default}
.chk{display:flex;flex-direction:column;gap:4px}
.chk label{display:flex;gap:10px;align-items:center;min-height:36px;cursor:pointer}
.chk input{width:20px;height:20px;min-height:0;accent-color:var(--blue)}
.items{font-size:15px}
.items th{font-size:13px;font-weight:500;color:var(--mut);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.items td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.items td:first-child{color:var(--mut);padding-top:15px;width:28px;text-align:center}
.items input,.items select{min-height:40px;padding:6px 8px;font-size:15px}
.items output{display:block;padding:10px 6px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.items .fixed{padding:10px 6px;display:block;font-weight:500}
.x{width:40px;height:40px;border-radius:8px;border:0;background:none;color:var(--mut);cursor:pointer;font-size:22px}.x:hover{color:var(--red);background:var(--redb)}
.vatc{display:flex;gap:4px}.vatc button{border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:12px;padding:0 6px;cursor:pointer;white-space:nowrap}
.add{margin-top:10px;min-height:40px;border:1px dashed var(--mut);border-radius:10px;background:none;padding:0 16px;cursor:pointer;color:var(--blue);font-weight:500}
.side{position:sticky;top:16px;display:grid;gap:14px}
@media(max-width:1000px){.side{position:static}}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg)}
.tot{display:grid;gap:6px}.tot div{display:flex;justify-content:space-between;gap:10px}.tot div span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.tot .big{font-size:22px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.tot .neg{color:var(--red)}
.words{font-size:14px;color:var(--mut);margin-top:6px}
.warn{background:var(--amberb);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:14px}.warn p{margin:0}.warn p+p{margin-top:6px}
.hint{background:var(--blueb);border-radius:12px;padding:12px 14px;font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;position:relative}
.steps li::before{content:"";position:absolute;left:13px;top:38px;bottom:-4px;width:2px;background:var(--line)}.steps li:last-child::before{display:none}
.steps .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg)}
.steps .ok .dot{background:var(--blue);border-color:var(--blue);color:light-dark(#fff,#0d1020)}.steps .now .dot{border-color:var(--blue);color:var(--blue)}.steps .no .dot{background:var(--red);border-color:var(--red);color:#fff}
.steps b{display:block;font-size:15px}.steps small{display:block;color:var(--mut);font-size:13px}
.actions{display:grid;gap:8px}.actions .btn{width:100%}
/* modal */
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--bg);border-radius:16px;padding:22px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal .box.wide{width:min(980px,100%);padding:0;background:var(--panel)}
.modal .bar2{position:sticky;top:0;background:var(--bg);display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);z-index:2;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-size:15px;max-width:calc(100vw - 32px)}
.save{font-size:13px;color:var(--mut)}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;white-space:normal;color:var(--mut);font-size:12px}.stack td:empty{display:none}
nav{margin-left:0;width:100%}nav a{padding:8px 10px;font-size:14px}}
@media(prefers-reduced-motion:reduce){.paper{transition:none}}
/* print sheet (preview + download) */
.pv{padding:16px;overflow:auto}
.ps{font-family:Sarabun,"TH Sarabun New",sans-serif;color:#000;font-size:14.5px;line-height:1.45}
.ps .page{width:210mm;min-height:297mm;padding:13mm 14mm;margin:0 auto 16px;background:#fff;box-shadow:0 2px 12px #0003;position:relative}
.ps .ph{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:8px;font-size:13px}
.ps .co{font-size:17px;font-weight:700}.ps .pno{text-align:right;white-space:nowrap}
.ps h2{text-align:center;font-size:19px;margin:12px 0 4px;font-weight:700}.ps .sub{text-align:center;margin:0 0 10px;font-size:13px}
.ps h4{font-size:15px;margin:12px 0 4px;font-weight:700}
.ps table{border-collapse:collapse;width:100%}
.ps .kv th{text-align:left;font-weight:600;width:19%;padding:3px 6px 3px 0;vertical-align:top;white-space:nowrap}.ps .kv td{padding:3px 8px 3px 0;border-bottom:1px dotted #777;vertical-align:top}
.ps .gt th,.ps .gt td{border:1px solid #000;padding:4px 6px;vertical-align:top}.ps .gt th{background:#eee;font-weight:600;text-align:center}
.ps .gt .r{text-align:right;white-space:nowrap}.ps .gt tfoot td{font-weight:700}
.ps .pbox{border:1px solid #000;padding:6px 8px;min-height:44px;white-space:pre-wrap}
.ps .dots{display:inline-block;min-width:120px;border-bottom:1px dotted #000}
.ps .sigs{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:12px;margin-top:18px;text-align:center;font-size:13.5px}
.ps .sig .ln{height:40px;border-bottom:1px dotted #000;margin:0 10px 4px;position:relative}
.ps .sig .stp{position:absolute;left:50%;top:4px;transform:translateX(-50%) rotate(-6deg);border:2px solid #1d3fb5;color:#1d3fb5;border-radius:5px;padding:0 8px;font-weight:700;font-size:13px;white-space:nowrap}
.ps .sig .stp.no{border-color:#c00;color:#c00}
.ps .para{text-indent:2.5em;margin:6px 0;text-align:justify}
.ps .u{border-bottom:1px dotted #000;padding:0 6px;font-weight:600}
.ps .fm{position:absolute;left:14mm;bottom:8mm;font-size:11px;color:#444}
.ps .note{font-size:12.5px;margin-top:6px}
@media print{body{background:#fff}.ps .page{box-shadow:none;margin:0;page-break-after:always}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header><div class="wrap">
  <div class="brand">ระบบเอกสารบัญชี<small id="coName">ใบขอซื้อ · เบิกจ่าย · ทดรองจ่าย · โครงการ</small></div>
  <nav id="nav">
    <a href="#home" data-r="home">หน้าหลัก</a>
    <a href="#new" data-r="new">สร้างเอกสาร</a>
    <a href="#docs" data-r="docs">เอกสารทั้งหมด</a>
    <a href="#projects" data-r="projects">โครงการ</a>
    <a href="#setup" data-r="setup">ตั้งค่า</a>
  </nav>
</div></header>
<div id="banner"></div>
<main class="band"><div class="wrap" id="app"><p class="mut">กำลังโหลด…</p></div></main>
<script>
{
/* ---------- utils ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>num(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const TM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TMS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate=(iso,short)=>{if(!iso)return'';const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return String(iso);return (+m[3])+' '+(short?TMS:TM)[+m[2]-1]+' '+(+m[1]+543)};
const dayDiff=(a,b)=>{const x=Date.parse(a),y=Date.parse(b);return Number.isFinite(x)&&Number.isFinite(y)?Math.round((y-x)/864e5):NaN};
const uid=()=>'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function bahtText(n){
  n=r2(num(n));const neg=n<0;n=Math.abs(n);let b=Math.floor(n),s=Math.round((n-b)*100);if(s>=100){b++;s=0}
  const D=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const six=(x,hi)=>{const ds=String(x).split('').reverse();let o='';for(let i=ds.length-1;i>=0;i--){const d=+ds[i];if(!d)continue;
    if(i===1&&d===1)o+='สิบ';else if(i===1&&d===2)o+='ยี่สิบ';else if(i===0&&d===1&&(x>9||hi))o+='เอ็ด';else o+=D[d]+P[i]}return o};
  const conv=x=>x<1e6?six(x,false):conv(Math.floor(x/1e6))+'ล้าน'+(x%1e6?six(x%1e6,true):'');
  if(!b&&!s)return'ศูนย์บาทถ้วน';
  return (neg?'ลบ':'')+(b?conv(b)+'บาท':'')+(s?six(s,false)+'สตางค์':'ถ้วน');
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function modal(html,wide){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  const close=()=>{m.remove();document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))close()});document.body.appendChild(m);m.close=close;
  setTimeout(()=>{const f=m.querySelector('textarea,input,select,button.pri');f&&f.focus()},30);return m}
function ask(msg,okLabel='ยืนยัน',danger){return new Promise(res=>{const m=modal(`<h3>${esc(msg)}</h3><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-close>ยกเลิก</button><button class="btn ${danger?'redf':'pri'}" id="okb">${esc(okLabel)}</button></div>`);
  m.querySelector('[data-close]').onclick=()=>res(false);m.querySelector('#okb').onclick=()=>{m.close();res(true)}})}

/* ---------- state ---------- */
let CAN_WRITE=true;
let DB=null,USER=null,ME=null,MODE='local',CAN_APPROVE=true,CAN_CFG=true,LOCAL=true,LOADED=false,DLS=null;

function write(id,fn){wq[id]=(wq[id]||Promise.resolve()).then(fn).catch(e=>{console.error(e);toast(e&&e.code==='quota_exceeded'?'พื้นที่ฐานข้อมูลเต็ม ลบเอกสารเก่าที่ไม่ใช้ก่อน':e&&(e.code==='invalid_argument'||e.code==='permission-denied')?'บันทึกไม่ได้ — บัญชีนี้มีสิทธิ์ดูอย่างเดียว ให้เจ้าของหน้าแชร์เป็น Contributor':'บันทึกไม่สำเร็จ: '+(e&&e.message||e));throw e});return wq[id]}
async function saveDoc(doc){
  doc.updatedAt=new Date().toISOString();const body=clone(doc);delete NEW[doc.id];
  const i=DOCS.findIndex(x=>x.id===doc.id);if(i<0)DOCS.push(body);else DOCS[i]=body;
  if(DB)await write(doc.id,()=>DB.collection('docs').doc(doc.id).set(body));else persistLocal();
}
async function removeDoc(id){DOCS=DOCS.filter(x=>x.id!==id);delete NEW[id];if(DB)await write(id,()=>DB.collection('docs').doc(id).delete());else persistLocal()}
async function saveCfg(){if(DB)await write('cfg',()=>DB.doc('config/company').set(clone(CFG)));else try{localStorage.setItem(LSC,JSON.stringify(CFG))}catch(e){}}
async function names(ids){ids=[...new Set(ids.filter(x=>x&&x!=='local'&&!(x in PROF)))];if(!ids.length||!USER)return;try{const ps=await USER.profiles(ids);ids.forEach(i=>PROF[i]=(ps&&ps[i]&&ps[i].name)||'')}catch(e){}}
const nameOf=id=>id==='local'||!id?'':(PROF[id]||'');
function fillNames(){const ids=$$('[data-uid]').map(e=>e.dataset.uid);names(ids).then(()=>$$('[data-uid]').forEach(e=>{e.textContent=nameOf(e.dataset.uid)||e.dataset.fb||'ผู้ใช้'}))}

const projects=()=>DOCS.filter(x=>x.type==='PJO'&&(x.status==='pending'||x.status==='approved')).map(x=>{
  const d=x.data||{};let budget=T.PJO.calc(d).total;
  const ch=DOCS.filter(y=>y.type==='PJC'&&y.status==='approved'&&(y.data||{}).projectId===x.id).sort((a,b)=>String(a.updatedAt).localeCompare(b.updatedAt));
  let end=d.end;ch.forEach(y=>(y.data.changes||[]).forEach(r=>{if(r.item==='งบประมาณรวม'&&num(r.nw))budget=num(r.nw);if(r.item==='วันที่สิ้นสุด'&&r.nw)end=r.nw}));
  return {id:x.id,doc:x,code:d.projCode||d.code||'',name:d.name||'(ไม่มีชื่อ)',budget,limit:num(d.limit),start:d.start,end,lead:d.lead,active:x.status==='approved',closed:ch.some(y=>y.data.kind==='ปิดโครงการ')}});
const projLabel=p=>p?(p.code?p.code+' · ':'')+p.name:'';
const projById=id=>projects().find(p=>p.id===id);
function usage(pid,exceptId){let c=0,s=0;DOCS.forEach(x=>{if(x.status!=='approved'||x.id===exceptId)return;const d=x.data||{};
  if(x.type==='PR'&&d.projectId===pid)c+=T.PR.calc(d).net;
  if(x.type==='EXP'&&d.projectId===pid)s+=T.EXP.calc(d,x).tNet;
  if(x.type==='TRV'&&d.projectId===pid)s+=T.TRV.calc(d).total});return {committed:r2(c),spent:r2(s),used:r2(c+s)}}
function advState(adv){const ex=DOCS.filter(x=>x.type==='EXP'&&(x.data||{}).advRef===adv.id&&x.status!=='rejected');
  if(ex.some(x=>x.status==='approved'))return 'cleared';if(ex.some(x=>x.status==='pending'))return 'clearing';return 'open'}
const advAmt=adv=>T.ADV.calc(adv.data||{}).total;

 totals:c=>[['งบโครงการ',c.budget],['ใช้จริง',c.used],['คงเหลือ',c.remain,1,c.remain<0],c.acc?['ตั้งค้างจ่าย',c.acc]:null,c.ast?['ทรัพย์สินโอนเข้าทะเบียน',c.ast]:null],
 warn(d,c){const w=[];const p=projById(d.projectId);if(p&&p.closed&&d.kind!=='ปิดโครงการ')w.push('โครงการนี้ปิดแล้ว');if(c.remain<0)w.push('ใช้งบเกินแล้ว '+money(-c.remain)+' บาท');return w},
 title:d=>{const p=projById(d.projectId);return (d.kind||'')+(p?' · '+p.name:'')}}
};
const ORDER=['PR','EXP','ADV','TRV','SUB','PJO','PJC'];

/* field metadata lookup */
function allFields(t){const out=[];T[t].secs.forEach(s=>s.f.forEach(f=>out.push(f)));return out}
const isReq=(f,d)=>typeof f.req==='function'?f.req(d):!!f.req;
const shown=(f,d)=>!f.show||f.show(d);
function missing(doc){const d=doc.data,m=[];T[doc.type].secs.forEach(s=>{if(s.show&&!s.show(d))return;s.f.forEach(f=>{if(!shown(f,d)||!isReq(f,d))return;
  if(f.t==='table'){if(!(d[f.k]||[]).some(r=>Object.entries(r).some(([k,v])=>k!=='cat'&&String(v??'').trim())))m.push(s.h)}else if(!String(d[f.k]??'').trim())m.push(f.l)})});return m}
const docAmount=doc=>{const c=T[doc.type].calc(doc.data||{},doc);return doc.type==='PJC'?c.used:c.total};
const docTitle=doc=>T[doc.type].title(doc.data||{})||T[doc.type].name;
function statusHTML(doc){const t=T[doc.type];let s=STAT[doc.status]||doc.status;if(doc.status==='pending'){const st=t.steps[doc.step||0];s='รอ: '+(st?st.n.split(' — ')[0].split(' / ')[0]:'อนุมัติ')}
  if(doc.status==='approved'&&t.done)s=t.done;return `<span class="stamp s-${esc(doc.status)}">${esc(s)}</span>`}
function nextNo(doc){const d=new Date(),p=T[doc.type].pfx(doc.data||{})+'-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+'-';let mx=0;
  DOCS.forEach(x=>{if(x.no&&x.no.startsWith(p)){const n=parseInt(x.no.slice(p.length),10);if(n>mx)mx=n}});return p+String(mx+1).padStart(4,'0')}
const isMine=doc=>!ME||doc.createdBy===ME||doc.createdBy==='local';
const stepEmails=doc=>{const st=T[doc.type].steps[doc.step||0];return String(((CFG.emails||{})[st?st.n:''])||'').toLowerCase().split(/[,;\s]+/).filter(Boolean)};
const canApproveDoc=doc=>doc.status==='pending'&&CAN_WRITE&&(CAN_APPROVE||(!!ME_EMAIL&&stepEmails(doc).includes(ME_EMAIL.toLowerCase())));
const canEditDoc=doc=>(doc.status==='draft'||doc.status==='rejected')&&(isMine(doc)||CAN_APPROVE);

/* ---------- form renderer ---------- */
function optHTML(list,v,blank){return (blank?`<option value="">${esc(blank)}</option>`:'')+list.map(o=>{const val=typeof o==='object'?o.v:o,lab=typeof o==='object'?o.l:o;return `<option value="${esc(val)}" ${String(val)===String(v??'')?'selected':''}>${esc(lab)}</option>`}).join('')}
function projOpts(v){const ps=projects().filter(p=>!p.closed||p.id===v);return optHTML(ps.map(p=>({v:p.id,l:projLabel(p)+(p.active?'':' (รออนุมัติ)')})),v,'— ไม่ระบุ / ค่าใช้จ่ายทั่วไป —')}
function advOpts(v,doc){const list=DOCS.filter(x=>x.type==='ADV'&&x.status==='approved'&&(x.createdBy===doc.createdBy||CAN_APPROVE||!ME)&&(x.id===v||advState(x)==='open'));
  return optHTML(list.map(x=>({v:x.id,l:(x.no||'')+' · '+money(advAmt(x))+' บาท · '+(x.data.purpose||'').slice(0,40)})),v,'— เลือกใบทดรอง —')}
function inputHTML(f,v,path,ro,doc){const dis=ro?'disabled':'',a=`data-k="${esc(path)}" ${dis}`;
  switch(f.t){
  case 'textarea':return `<textarea ${a} rows="3">${esc(v)}</textarea>`;
  case 'select':return `<select ${a}>${optHTML(f.o,v)}</select>`;
  case 'dept':return `<select ${a}>${optHTML(deptList(),v,'— เลือกแผนก —')}</select>`;
  case 'project':return `<select ${a}>${projOpts(v)}</select>`;
  case 'advance':return `<select ${a}>${advOpts(v,doc)}</select>`;
  case 'radio':return `<div class="seg" role="radiogroup">${f.o.map(o=>`<label><input type="radio" name="${esc(path)}" value="${esc(o)}" ${o===v?'checked':''} ${a}><span>${esc(o)}</span></label>`).join('')}</div>`;
  case 'checks':return `<div class="chk">${f.o.map(o=>`<label><input type="checkbox" value="${esc(o)}" ${(v||[]).includes(o)?'checked':''} ${a} data-multi="1"><span>${esc(o)}</span></label>`).join('')}</div>`;
  case 'calc':return `<output data-calc="${esc(f.k)}"></output>`;
  case 'note':return `<div class="hint" data-calc="${esc(f.k)}"></div>`;
  case 'num':return `<input type="text" inputmode="decimal" value="${esc(v)}" ${a} data-num="1">`;
  case 'date':case 'time':return `<input type="${f.t}" value="${esc(v)}" ${a}>`;
  case 'fixed':return `<span class="fixed">${esc(v)}</span>`;
  case 'vat':return `<div class="vatc"><input type="text" inputmode="decimal" value="${esc(v)}" ${a} data-num="1">${ro?'':`<button type="button" data-vat="${esc(path)}" title="คำนวณ 7% จากยอดก่อน VAT">7%</button>`}</div>`;
  default:return `<input type="text" value="${esc(v)}" ${a}>`}}
function tableHTML(f,d,ro,doc){const rows=d[f.k]||[];return `<div class="scroll"><table class="items"><thead><tr><th>#</th>${f.cols.map(c=>`<th style="min-width:${c.w||120}px" class="${c.calc||c.t==='num'?'r':''}">${esc(c.l)}</th>`).join('')}${ro||f.fixed?'':'<th></th>'}</tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td>${i+1}</td>${f.cols.map(c=>`<td>${c.calc?`<output data-rc="${esc(f.k+'.'+i+'.'+c.k)}"></output>`:inputHTML(c,r[c.k],f.k+'.'+i+'.'+c.k,ro,doc)}</td>`).join('')}${ro||f.fixed?'':`<td><button type="button" class="x" data-del="${esc(f.k)}" data-i="${i}" aria-label="ลบแถว ${i+1}">×</button></td>`}</tr>`).join('')}
  </tbody></table></div>${ro||f.fixed?'':`<button type="button" class="add" data-add="${esc(f.k)}">+ เพิ่มรายการ</button>`}`}
function formHTML(doc,ro){const t=T[doc.type],d=doc.data;let n=0;return t.secs.map((s,si)=>{const vis=!s.show||s.show(d);if(vis)n++;
  return `<section class="sec" data-sec="${si}" ${vis?'':'hidden'}><h3><em>${vis?n:''}</em>${esc(s.h)}</h3>${s.sub?`<p class="mut small" style="margin:-4px 0 12px">${esc(s.sub)}</p>`:''}
  <div class="flds">${s.f.map(f=>f.t==='table'?`<div class="fld full" data-f="${esc(f.k)}" ${shown(f,d)?'':'hidden'}>${f.l?`<span>${esc(f.l)}</span>`:''}${tableHTML(f,d,ro,doc)}</div>`
   :`<div class="fld ${f.w||''}" data-f="${esc(f.k)}" ${shown(f,d)?'':'hidden'}><span>${esc(f.l)}${isReq(f,d)&&!ro?'<i>*</i>':''}</span>${inputHTML(f,d[f.k],f.k,ro,doc)}${f.hint&&!ro?`<small>${esc(f.hint)}</small>`:''}</div>`).join('')}</div></section>`}).join('')}
function refresh(doc){const t=T[doc.type],d=doc.data,c=t.calc(d,doc);
  $$('[data-calc]').forEach(e=>{const v=c[e.dataset.calc];e.textContent=v==null?'':String(v);e.hidden=e.classList.contains('hint')&&!v});
  t.secs.forEach(s=>s.f.forEach(f=>{if(f.t==='table')(d[f.k]||[]).forEach((r,i)=>f.cols.forEach(cl=>{if(!cl.calc)return;const e=document.querySelector(`[data-rc="${CSS.escape(f.k+'.'+i+'.'+cl.k)}"]`);if(e){const v=cl.calc(r,d);e.textContent=v===''||(!v&&!Object.values(r).some(Boolean))?'':money(v)}}))}));
  let n=0;t.secs.forEach((s,si)=>{const el=$(`[data-sec="${si}"]`);if(!el)return;const vis=!s.show||s.show(d);el.hidden=!vis;if(vis)el.querySelector('h3 em').textContent=++n;
    s.f.forEach(f=>{const fe=el.querySelector(`[data-f="${CSS.escape(f.k)}"]`);if(fe)fe.hidden=!shown(f,d)})});
  const tot=$('#tot');if(tot)tot.innerHTML=t.totals(c).filter(Boolean).map(([l,v,big,neg])=>`<div class="${big?'big':''} ${neg?'neg':''}"><span>${esc(l)}</span><span>${money(v)}</span></div>`).join('')+(c.total?`<div class="words">(${esc(bahtText(c.total))})</div>`:'');
  const w=$('#warn');if(w){const ws=[...new Set(t.warn(d,c,doc))];w.hidden=!ws.length;w.innerHTML=ws.map(x=>`<p>⚠ ${esc(x)}</p>`).join('')}}
function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){const k=/^\d+$/.test(ks[i])?+ks[i]:ks[i];o=o[k]}o[ks[ks.length-1]]=val}

function vDoc(id){const src=NEW[id]||DOCS.find(x=>x.id===id);
  if(!src){app.innerHTML=LOADED?'<div class="empty">ไม่พบเอกสารนี้ อาจถูกลบไปแล้ว <a href="#docs">กลับไปรายการเอกสาร</a></div>':'<p class="mut">กำลังโหลดเอกสาร…</p>';return}
  const ed=canEditDoc(src);if(!(EDITING&&EDIT&&EDIT.id===id))EDIT=clone(src);EDITING=ed;DIRTY=false;const doc=EDIT,t=T[doc.type];
  const p=projById(doc.data.projectId);
  app.innerHTML=`<div class="dochead"><div><a href="#docs" class="mut small">← เอกสารทั้งหมด</a><h1 style="margin-top:6px">${esc(t.name)}</h1>
   <div class="row mut small"><span>${esc(t.en)}</span><span>·</span><b style="color:var(--ink)">${esc(doc.no||'ยังไม่ออกเลข (ออกเมื่อส่งอนุมัติ)')}</b>${doc.type==='PJO'&&doc.data.projCode?`<span>· รหัสโครงการ <b style="color:var(--ink)">${esc(doc.data.projCode)}</b></span>`:''}<span class="save" id="savest"></span></div></div>${statusHTML(doc)}</div>
  ${doc.status==='rejected'?`<div class="warn" style="margin-bottom:16px"><p>เอกสารถูกตีกลับ: ${esc((doc.log||[]).filter(l=>l.act==='reject').slice(-1)[0]?.note||'—')} — แก้ไขแล้วส่งอนุมัติอีกครั้งได้</p></div>`:''}
  <div class="sheet"><form id="form" autocomplete="off" onsubmit="return false">${formHTML(doc,!ed)}</form>
  <aside class="side"><div class="card"><h3>ยอดรวม</h3><div class="tot" id="tot"></div></div><div class="warn" id="warn" hidden></div>
   <div class="card"><h3>ขั้นตอนอนุมัติ</h3>${stepsHTML(doc)}</div><div class="card actions" id="acts">${actionsHTML(doc,ed)}</div></aside></div>`;
  refresh(doc);fillNames();bindForm(doc,ed);bindActions(doc)}
function stepsHTML(doc){const t=T[doc.type],log=doc.log||[];const sub=log.filter(l=>l.act==='submit').slice(-1)[0];
  const items=[{n:'ผู้ขอ / ผู้จัดทำ',d:'ส่งเอกสาร',state:doc.status!=='draft'?'ok':'now',l:sub}].concat(t.steps.map((s,i)=>{const l=log.filter(x=>x.step===i&&(x.act==='approve'||x.act==='reject')).slice(-1)[0];
   let st='';if(doc.status==='approved'||(doc.status==='pending'&&i<doc.step))st='ok';else if(doc.status==='pending'&&i===doc.step)st='now';else if(doc.status==='rejected'&&l&&l.act==='reject'&&i===doc.step)st='no';
   return {n:s.n,d:s.d,state:st,l:st?l:null}}));
  return `<ol class="steps">${items.map((s,i)=>`<li class="${s.state}"><span class="dot">${s.state==='ok'?'✓':s.state==='no'?'×':i+1}</span><div><b>${esc(s.n)}</b>${s.l?`<small><span data-uid="${esc(s.l.by)}" data-fb="${esc(s.l.name||'')}"></span> · ${esc(thDate(String(s.l.at).slice(0,10),1))}${s.l.note?' · '+esc(s.l.note):''}${s.l.amount!=null?' · อนุมัติ '+money(s.l.amount)+' บาท':''}</small>`:s.d?`<small>${esc(s.d)}</small>`:''}</div></li>`).join('')}</ol>`}
function actionsHTML(doc,ed){const t=T[doc.type],b=[];
  if(ed){b.push(`<button class="btn pri" id="a_submit">${doc.status==='rejected'?'ส่งอนุมัติอีกครั้ง':'ส่งอนุมัติ'}</button>`,`<button class="btn" id="a_save">บันทึกร่าง</button>`)}
  if(canApproveDoc(doc)){const s=t.steps[doc.step||0];b.push(`<button class="btn pri" id="a_ok">${esc(s.verb||'อนุมัติ')} — ${esc(s.n.split(' — ')[0])}</button>`,`<button class="btn danger" id="a_no">ไม่อนุมัติ / ตีกลับ</button>`)}
  if(doc.status==='pending'&&isMine(doc)&&!doc.step)b.push(`<button class="btn" id="a_back">ดึงกลับมาแก้ไข</button>`);
  if(doc.status==='pending'&&!canApproveDoc(doc)){const em=stepEmails(doc);b.push(`<p class="small mut" style="margin:0">${!CAN_WRITE?'คุณมีสิทธิ์ดูอย่างเดียว จึงกดอนุมัติไม่ได้ — ให้เจ้าของหน้าแชร์เป็น Contributor ขึ้นไป':em.length?'ผู้อนุมัติขั้นนี้: '+esc(em.join(', '))+(ME_EMAIL?' (คุณ: '+esc(ME_EMAIL)+')':''):'ขั้นนี้ยังไม่ได้กำหนดอีเมลผู้อนุมัติ — ตั้งได้ที่หน้า “ตั้งค่า”'}</p>`)}
  if(doc.status==='pending')b.push(`<button class="btn" id="a_mail">✉ ส่งอีเมลขออนุมัติ</button>`);
  if(doc.status==='approved'||doc.status==='rejected')b.push(`<button class="btn" id="a_mail2">✉ แจ้งผลทางอีเมล</button>`);
  if(DOCS.some(x=>x.id===doc.id)||doc.status!=='draft')b.push(`<button class="btn" id="a_print">ดาวน์โหลดแบบฟอร์ม (Excel / พิมพ์)</button>`);
  b.push(`<button class="btn" id="a_dup">ทำสำเนาเป็นใบใหม่</button>`);
  if(doc.type==='ADV'&&doc.status==='approved'&&advState(doc)==='open')b.push(`<button class="btn" id="a_clear">เคลียร์เงินทดรองนี้</button>`);
  if(doc.type==='PJO'&&doc.status==='approved')b.push(`<button class="btn" id="a_pr">ออก PR ภายใต้โครงการนี้</button>`);
  if(doc.status==='draft'&&(isMine(doc)||CAN_APPROVE)&&DOCS.some(x=>x.id===doc.id))b.push(`<button class="btn danger" id="a_del">ลบร่าง</button>`);
  return b.join('')}
function markDirty(doc){DIRTY=true;const s=$('#savest');if(s)s.textContent='· กำลังบันทึก…';clearTimeout(saveT);saveT=setTimeout(async()=>{if(!EDIT||EDIT.id!==doc.id)return;try{await saveDoc(EDIT);DIRTY=false;const s2=$('#savest');if(s2)s2.textContent='· บันทึกร่างอัตโนมัติแล้ว';refreshActs()}catch(e){}},1200)}
function bindForm(doc,ed){const form=$('#form');if(!ed)return;
  const onIn=e=>{const el=e.target,k=el.dataset.k;if(!k)return;let v;
   if(el.dataset.multi){v=[...form.querySelectorAll(`[data-k="${CSS.escape(k)}"]:checked`)].map(x=>x.value)}else if(el.type==='radio'){if(!el.checked)return;v=el.value}else v=el.value;
   if(el.dataset.num)v=v.replace(/[^\d.\-]/g,'')===''?'':v.replace(/[^\d.\-]/g,'');
   setPath(doc.data,k,v);if(el.dataset.num&&el.value!==v&&e.type==='change')el.value=v;
   if(k==='projectId'&&doc.type==='PJC'&&e.type==='change'){const p=projById(v);if(p&&!doc.data.reporter)doc.data.reporter=p.lead||''}
   if(k==='advRef'&&e.type==='change'){const a=DOCS.find(x=>x.id===v);if(a){['requester','position','dept'].forEach(f=>{if(!doc.data[f])doc.data[f]=a.data[f]||''});if(!doc.data.purpose)doc.data.purpose='เคลียร์เงินทดรอง '+a.no+' — '+(a.data.purpose||'');rerender(doc);markDirty(doc);return}}
   refresh(doc);markDirty(doc)};
  form.addEventListener('input',onIn);form.addEventListener('change',onIn);
  form.addEventListener('click',e=>{const a=e.target.closest('[data-add]'),x=e.target.closest('[data-del]'),v=e.target.closest('[data-vat]');
   if(a){(doc.data[a.dataset.add]=doc.data[a.dataset.add]||[]).push({});rerender(doc);markDirty(doc);const ins=$$(`[data-k^="${a.dataset.add}."]`);const last=ins.filter(i=>i.dataset.k.startsWith(a.dataset.add+'.'+(doc.data[a.dataset.add].length-1)+'.'))[0];last&&last.focus()}
   if(x){doc.data[x.dataset.del].splice(+x.dataset.i,1);if(!doc.data[x.dataset.del].length)doc.data[x.dataset.del].push({});rerender(doc);markDirty(doc)}
   if(v){const base=v.dataset.vat.replace(/\.vat$/,''),r=getPath(doc.data,base);r.vat=r2(num(r.net)*vatRate()).toFixed(2);v.previousElementSibling.value=r.vat;refresh(doc);markDirty(doc)}})}
function refreshActs(){const a=$('#acts');if(a&&EDIT&&!a.querySelector('#a_print')){a.innerHTML=actionsHTML(EDIT,EDITING);bindActions(EDIT)}}
function rerender(doc){const y=scrollY;$('#form').innerHTML=formHTML(doc,false);refresh(doc);scrollTo(0,y)}
function bindActions(doc){const on=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
  on('a_save',async()=>{clearTimeout(saveT);await saveDoc(EDIT);toast('บันทึกร่างแล้ว');$('#savest').textContent='· บันทึกแล้ว';refreshActs()});
  on('a_submit',async()=>{const m=missing(EDIT);if(m.length){toast('กรอกให้ครบก่อน: '+m.slice(0,4).join(', ')+(m.length>4?' …':''));const f=$('[data-f] :is(input,select,textarea)');return}
   const amt=docAmount(EDIT);if(!(await ask('ส่ง'+T[EDIT.type].name+(amt?' ยอด '+money(amt)+' บาท':'')+' เพื่ออนุมัติ?','ส่งอนุมัติ')))return;
   clearTimeout(saveT);if(!EDIT.no)EDIT.no=nextNo(EDIT);EDIT.status='pending';EDIT.step=0;(EDIT.log=EDIT.log||[]).push({act:'submit',by:ME||'local',name:reqName(EDIT.data),at:new Date().toISOString()});
   if(!EDIT.reqEmail&&ME_EMAIL)EDIT.reqEmail=ME_EMAIL;EDITING=false;const sent=EDIT;await saveDoc(EDIT);toast('ส่งแล้ว เลขที่ '+EDIT.no);render();mailDlg(sent,'ask')});
  on('a_ok',()=>approveDlg(doc));on('a_no',()=>rejectDlg(doc));
  on('a_back',async()=>{if(!(await ask('ดึงเอกสารกลับมาเป็นร่างเพื่อแก้ไข?','ดึงกลับ')))return;const d=clone(doc);d.status='draft';d.step=0;d.log.push({act:'withdraw',by:ME||'local',at:new Date().toISOString()});EDITING=false;EDIT=null;await saveDoc(d);render()});
  on('a_print',()=>printDlg(doc));on('a_mail',()=>mailDlg(doc,'ask'));on('a_mail2',()=>mailDlg(doc,'result'));on('a_dup',()=>{const d=clone(doc.data);if(doc.type==='PJO'){delete d.projCode;delete d.setupDate;delete d.acctChecks}EDITING=false;newDoc(doc.type,d)});
  on('a_clear',()=>{EDITING=false;const d=T.EXP.init();Object.assign(d,{kind:'เคลียร์เงินทดรองจ่าย',advRef:doc.id,requester:doc.data.requester,position:doc.data.position,dept:doc.data.dept,purpose:'เคลียร์เงินทดรอง '+doc.no+' — '+(doc.data.purpose||'')});newDoc('EXP',d)});
  on('a_pr',()=>{EDITING=false;const d=T.PR.init();d.projectId=doc.id;d.purpose=doc.data.ptype==='โครงการวิจัย'?PURP[1]:PURP[0];newDoc('PR',d)});
  on('a_del',async()=>{if(!(await ask('ลบร่างนี้ถาวร? กู้คืนไม่ได้','ลบ',1)))return;clearTimeout(saveT);EDITING=false;EDIT=null;await removeDoc(doc.id);location.hash='docs'})}
function approveDlg(doc){if(!canApproveDoc(doc)){toast('คุณไม่มีสิทธิ์อนุมัติขั้นนี้');return}const t=T[doc.type],s=t.steps[doc.step||0],self=isMine(doc)&&ME;const total=docAmount(doc);
  const m=modal(`<h3>${esc(s.verb||'อนุมัติ')}: ${esc(s.n)}</h3><p class="mut small">${esc(doc.no)} · ${esc(docTitle(doc))} · ${money(total)} บาท</p>
   ${self?'<div class="warn" style="margin:10px 0"><p>คุณเป็นผู้สร้างเอกสารนี้เอง</p></div>':''}
   ${s.partial?`<div class="fld" style="margin:12px 0"><span>ผลการอนุมัติ</span><div class="seg"><label><input type="radio" name="pa" value="full" checked><span>อนุมัติเต็มจำนวน</span></label><label><input type="radio" name="pa" value="part"><span>อนุมัติบางส่วน</span></label></div><input id="pamt" placeholder="จำนวนเงินที่อนุมัติ (บาท)" inputmode="decimal" hidden style="margin-top:8px"></div>`:''}
   ${(s.fields||[]).map(f=>`<div class="fld" style="margin:12px 0"><span>${esc(f.l)}${f.req?'<i>*</i>':''}</span><input id="sf_${esc(f.k)}" type="${f.t==='date'?'date':'text'}" value="${esc(doc.data[f.k]||(f.t==='date'?today():''))}"></div>`).join('')}
   ${s.checks?`<div class="chk" style="margin:12px 0">${s.checks.map(c=>`<label><input type="checkbox" class="sck" value="${esc(c)}" checked><span>${esc(c)}</span></label>`).join('')}</div>`:''}
   <div class="fld" style="margin:12px 0"><span>หมายเหตุ</span><textarea id="anote" rows="2"></textarea></div>
   <div class="row" style="justify-content:flex-end"><button class="btn" data-close>ยกเลิก</button><button class="btn pri" id="aok">${esc(s.verb||'อนุมัติ')}</button></div>`);

function xlOverflow(doc,v){const d=doc.data;const n={PR:filled(d.items,['desc','qty','price']).length,EXP:filled(d.items,['detail','net','receipt']).length,ADV:filled(d.items,['desc','amount']).length,SUB:filled(d.items,['detail','amount']).length,TRV:filled(d.items,['detail','amount']).length}[doc.type];
  const w=[];if(v.max&&n>v.max)w.push('มี '+n+' รายการ แต่แบบฟอร์ม Excel มี '+v.max+' บรรทัด — รายการที่เกินจะรวมไว้บรรทัดสุดท้าย');
  if(doc.type==='PJC'&&filled(d.changes,['item','old','nw']).length>5)w.push('แบบฟอร์มรับรายการเปลี่ยนแปลงได้ 5 บรรทัด');
  if(doc.type==='PJC'&&filled(d.accruals,['item','amount']).length>3)w.push('แบบฟอร์มรับรายการค้างจ่ายได้ 3 บรรทัด');
  if(doc.type==='PJC'&&filled(d.assets,['item','cost']).length>4)w.push('แบบฟอร์มรับรายการทรัพย์สินได้ 4 บรรทัด');return w}
async function dlXlsx(doc,i,btn){const v=XL[doc.type][i];btn.disabled=true;const old=btn.textContent;btn.textContent='กำลังสร้างไฟล์…';
  try{await names((doc.log||[]).map(l=>l.by));const blob=await buildXlsx(v,doc);const sfx=XL[doc.type].length>1?'-แบบ'+(i+1):'';await download(((doc.no||'ร่าง-'+T[doc.type].name)+sfx).replace(/[\\/:*?"<>|]+/g,'-')+'.xlsx',blob)}catch(e){console.error(e);toast('สร้างไฟล์ Excel ไม่สำเร็จ: '+(e.message||e))}finally{btn.disabled=false;btn.textContent=old}}

window.addEventListener('hashchange',()=>{if(DIRTY&&EDIT){clearTimeout(saveT);saveDoc(EDIT).catch(()=>{});DIRTY=false}EDITING=false;EDIT=null;render();scrollTo(0,0)});
function onDocs(list){DOCS=list;LOADED=true;if(EDITING){stale=true;return}render()}
try{DOCS=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){DOCS=[]}try{Object.assign(CFG,JSON.parse(localStorage.getItem(LSC)||'{}'))}catch(e){}
LOADED=true;applyCfg();render();
/* Firebase config: paste firebaseConfig here to run on GitHub Pages with a shared database */
const FB_CONFIG=null;
const FB_V='10.14.1';

const loadJs=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s)});
function connectDb(db){
  DB=db;LOCAL=false;LOADED=false;DOCS=[];if(!CAN_WRITE)$('#banner').innerHTML='<div class="banner">บัญชีนี้มีสิทธิ์ดูอย่างเดียว (Viewer) — สร้างหรืออนุมัติเอกสารไม่ได้ ขอให้เจ้าของหน้าแชร์เป็น Contributor</div>';render();
  const tm=setTimeout(()=>{$('#banner').innerHTML='<div class="banner">ยังเชื่อมต่อฐานข้อมูลไม่ได้ ข้อมูลที่เห็นอาจไม่เป็นปัจจุบัน</div>';LOADED=true;if(!EDITING)render()},10000);
  db.doc('config/company').onSnapshot(s=>{if(s.exists){Object.assign(CFG,s.data());if(MODE==='firebase')fbRoles();applyCfg();if(!EDITING&&(route()==='setup'||route()==='home'))render()}},()=>{});
  db.collection('docs').onSnapshot(s=>{if(!s.metadata.fromCache){clearTimeout(tm);if(CAN_WRITE)$('#banner').innerHTML=''}onDocs(s.docs.map(x=>({...x.data(),id:x.id})))},e=>{clearTimeout(tm);LOADED=true;$('#banner').innerHTML='<div class="banner">โหลดข้อมูลไม่สำเร็จ ('+esc(e&&e.code)+')'+(e&&e.code==='permission-denied'?' — อีเมลนี้ยังไม่ได้รับอนุญาตให้ใช้ระบบ':'')+'</div>';render()})}
function fbRoles(){const ad=String(CFG.admins||'').toLowerCase().split(/[,;\s]+/).filter(Boolean);CAN_APPROVE=!ad.length||ad.includes(String(ME_EMAIL).toLowerCase());CAN_CFG=CAN_APPROVE}
async function bootFirebase(){
  MODE='firebase';
  for(const m of ['app','auth','firestore'])await loadJs(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-${m}-compat.js`);
  firebase.initializeApp(FB_CONFIG);const auth=firebase.auth(),fs=firebase.firestore();
  const u=await new Promise(r=>{const un=auth.onAuthStateChanged(x=>{un();r(x)})});
  if(!u){$('#nav').hidden=true;app.innerHTML=`<div style="max-width:420px;margin:8vh auto;text-align:center"><h1>เข้าสู่ระบบ</h1><p class="mut">ใช้บัญชี Google ของบริษัท</p><button class="btn pri" id="gsign" style="margin-top:18px;width:100%">เข้าสู่ระบบด้วย Google</button><p class="mut small" id="gerr" style="margin-top:12px"></p></div>`;
    $('#gsign').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());location.reload()}catch(e){$('#gerr').textContent='เข้าสู่ระบบไม่สำเร็จ: '+(e&&e.code||e)}};return}
  ME=u.uid;ME_EMAIL=u.email||'';PROF[ME]=u.displayName||ME_EMAIL;
  try{const ur=fs.collection('users').doc(ME),cur=await ur.get();const want={name:u.displayName||'',email:ME_EMAIL};const have=cur.exists?cur.data():{};if(have.name!==want.name||have.email!==want.email)await ur.set(want)}catch(e){}
  USER={profiles:async ids=>{const out={};await Promise.all(ids.map(async i=>{try{const d=await fs.collection('users').doc(i).get();if(d.exists)out[i]=d.data()}catch(e){}}));return out}};
  fbRoles();
  const who=document.createElement('a');who.href='#';who.textContent='ออกจากระบบ ('+ME_EMAIL+')';who.onclick=async e=>{e.preventDefault();await auth.signOut();location.reload()};$('#nav').appendChild(who);
  connectDb(fs)}
(async()=>{
  if(FB_CONFIG&&!(typeof claude!=='undefined'&&claude&&claude.use)){try{await bootFirebase()}catch(e){console.error(e);$('#banner').innerHTML='<div class="banner">เชื่อมต่อ Firebase ไม่ได้: '+esc(e.message||e)+'</div>'}return}
  let db=null,user=null;if(typeof claude!=='undefined'&&claude&&claude.use){try{[db,user,DLS]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')])}catch(e){}}
  USER=user;
  if(user){try{ME=await user.id()}catch(e){}try{const ce=await user.canEdit(),ow=await user.isOwner();CAN_APPROVE=!!(ce||ow);CAN_CFG=CAN_APPROVE}catch(e){}
    try{const me=await user.me();if(me&&ME)PROF[ME]=me.name||'';if(me&&me.email)ME_EMAIL=me.email}catch(e){}
    try{const w=await user.can('data.write');if(w===false)CAN_WRITE=false}catch(e){}}
  if(!db){$('#banner').innerHTML='<div class="banner">โหมดเครื่องเดียว — ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น คนอื่นจะไม่เห็นเอกสารของคุณ</div>';render();return}
  MODE='claude';connectDb(db);
})();
}
